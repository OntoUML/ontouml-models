name: Process new model submission

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: "Repository-relative model folder to process, for example models/example-model"
        required: true
        type: string
      metadata_timestamp:
        description: "xsd:dateTime value for FDP timestamps, or 'now'"
        required: true
        default: "now"
        type: string
      metadata_repository:
        description: "Repository used in generated storage/download URLs"
        required: true
        default: "OntoUML/ontouml-models"
        type: string
      metadata_branch:
        description: "Branch used in generated storage/download URLs"
        required: true
        default: "master"
        type: string
      allow_missing_license:
        description: "Allow missing license metadata; intended only for legacy datasets"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Validate and report without writing generated metadata"
        required: true
        default: false
        type: boolean
      commit_changes:
        description: "Commit generated/updated files back to the same branch"
        required: true
        default: true
        type: boolean

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "models/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: process-new-model-submission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reject-fork-pr:
    name: Reject fork PR
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain unsupported PR source
        run: |
          cat <<'EOF'
          Automated metadata generation is currently supported only for pull requests
          opened from branches inside this repository. Fork-based PR automation will
          be considered later.
          EOF
          exit 1

  classify:
    name: Classify changed model files
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      model_path: ${{ steps.changes.outputs.model_path }}
      head_sha: ${{ steps.changes.outputs.head_sha }}

    steps:
      - name: Check out repository branch without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODEL_PATH: ${{ inputs.model_path }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "mode=normal" >> "$GITHUB_OUTPUT"
            echo "model_path=${INPUT_MODEL_PATH}" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Selected normal manual-processing mode for ${INPUT_MODEL_PATH}."
            exit 0
          fi

          git fetch origin "$BASE_REF" --depth=1
          python - "origin/${BASE_REF}" HEAD <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          import sys

          base_ref, head_ref = sys.argv[1:]
          completed = subprocess.run(
              ["git", "diff", "--name-only", "-z", f"{base_ref}...{head_ref}"],
              check=True,
              stdout=subprocess.PIPE,
          )
          changed = [
              path.decode("utf-8").replace("\\", "/").strip("/")
              for path in completed.stdout.split(b"\0")
              if path
          ]
          if not changed:
              print("No changed files were detected.", file=sys.stderr)
              raise SystemExit(2)

          allowed_root = {"catalog.ttl"}
          generated_model_files = {
              "ontology.ttl",
              "metadata.ttl",
              "metadata-turtle.ttl",
          }
          unexpected = []
          invalid_model_paths = []
          model_folders = set()

          for path in changed:
              if path in allowed_root:
                  continue
              parts = path.split("/")
              if not path.startswith("models/"):
                  unexpected.append(path)
              elif len(parts) < 3:
                  invalid_model_paths.append(path)
              else:
                  model_folders.add("/".join(parts[:2]))

          if unexpected:
              print(
                  "Model-submission PRs may not change files outside the target "
                  "model folder(s) and generated catalog.ttl:\n"
                  + "\n".join(f"- {path}" for path in unexpected),
                  file=sys.stderr,
              )
              raise SystemExit(2)
          if invalid_model_paths:
              print(
                  "Changed model paths must be inside a direct model folder:\n"
                  + "\n".join(f"- {path}" for path in invalid_model_paths),
                  file=sys.stderr,
              )
              raise SystemExit(2)
          if not model_folders:
              print(
                  "Exactly one model folder or a generated-only multi-model "
                  "change is required; detected no model folders.",
                  file=sys.stderr,
              )
              raise SystemExit(2)

          ordered_folders = sorted(model_folders)
          if len(ordered_folders) == 1:
              mode = "normal"
              model_path = ordered_folders[0]
          else:
              disallowed = []
              for path in changed:
                  if path in allowed_root:
                      continue
                  parts = path.split("/")
                  if len(parts) != 3:
                      disallowed.append(path)
                      continue
                  file_name = parts[2]
                  if file_name not in generated_model_files:
                      disallowed.append(path)
              if disallowed:
                  print(
                      "Multiple model folders are permitted only for generated-"
                      "artifact maintenance. Contributor-source or unrecognized "
                      "paths were found:\n"
                      + "\n".join(f"- {path}" for path in disallowed),
                      file=sys.stderr,
                  )
                  raise SystemExit(2)
              mode = "bulk-generated"
              model_path = ""

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mode={mode}\n")
              output.write(f"model_path={model_path}\n")
              output.write(
                  "head_sha="
                  + subprocess.check_output(
                      ["git", "rev-parse", "HEAD"], text=True
                  ).strip()
                  + "\n"
              )

          print(f"Selected mode: {mode}")
          print("Changed model folders: " + ", ".join(ordered_folders))
          PY

  process:
    name: Process model submission
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'normal' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && needs.classify.outputs.head_sha || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Process model submission
        env:
          MODEL_PATH: ${{ needs.classify.outputs.model_path }}
          METADATA_TIMESTAMP: ${{ github.event_name == 'workflow_dispatch' && inputs.metadata_timestamp || 'now' }}
          METADATA_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.metadata_repository || 'OntoUML/ontouml-models' }}
          METADATA_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.metadata_branch || github.base_ref }}
          ALLOW_MISSING_LICENSE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_missing_license || false }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail

          cmd=(
            python
            scripts/process_new_model_submission.py
            "$MODEL_PATH"
            --metadata-timestamp "$METADATA_TIMESTAMP"
            --repository "$METADATA_REPOSITORY"
            --branch "$METADATA_BRANCH"
          )

          if [ "$ALLOW_MISSING_LICENSE" = "true" ]; then
            cmd+=(--allow-missing-license)
          fi

          if [ "$DRY_RUN" = "true" ]; then
            cmd+=(--dry-run)
          fi

          "${cmd[@]}"

      - name: Synchronize catalog metadata
        if: ${{ github.event_name == 'pull_request' || !inputs.dry_run }}
        run: python scripts/generate_catalog_file.py .

      - name: Commit generated files
        if: ${{ success() && ((github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.commit_changes)) }}
        env:
          MODEL_PATH: ${{ needs.classify.outputs.model_path }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$MODEL_PATH" catalog.ttl

          if git diff --cached --quiet -- "$MODEL_PATH" catalog.ttl; then
            echo "No generated changes to commit."
            exit 0
          fi

          model_slug="$(basename "$MODEL_PATH")"
          git commit -m "chore(metadata): process model submission ${model_slug}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git push origin "HEAD:${HEAD_REF}"
          else
            git push
          fi

  validate-bulk-generated-maintenance:
    name: Validate bulk generated-artifact maintenance
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'bulk-generated' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out pull request without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Check ontology Turtle synchronization
        run: python scripts/generate_ontology_turtle.py --all --models-dir models --check --quiet

      - name: Check dependent metadata synchronization
        run: |
          set -euo pipefail
          python scripts/generate_turtle_metadata.py --all --models-dir models --allow-missing-license --check --quiet
          python scripts/metadata_yaml_to_ttl.py --all --models-dir models --allow-missing-license --check --quiet
          python scripts/generate_catalog_file.py . --check

      - name: Parse all model Turtle files
        run: |
          python - <<'PY'
          from pathlib import Path

          from rdflib import Graph

          paths = sorted(Path("models").glob("*/*.ttl"))
          if not paths:
              raise SystemExit("No model Turtle files were found.")
          for path in paths:
              Graph().parse(path, format="turtle")
          print(f"Parsed {len(paths)} model Turtle files.")
          PY

      - name: Confirm validation did not modify the checkout
        run: git diff --exit-code -- .
