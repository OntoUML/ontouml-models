editorialNote: "The submitted model comprises ontologies for wargame design characteristics, wargame elements, and the specification and design phases of the wargame design process. The models are intended as a reference for wargame design and development and as a foundation for interoperability between wargames; planning, execution, and analysis phases remain outside the current scope."
